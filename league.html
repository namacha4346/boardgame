<title>盤士リーグ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout: 看板（リーグ名・進行状況）→ タブ。チーム順位は0を中心にした左右の棒、節ごとに4卓のカードを並べる */
:root {
  --bg: #eef0ec;
  --surface: #fbfcf9;
  --ink: #1d2420;
  --muted: #5f6a63;
  --line: #cfd6cf;
  --accent: #2f6b4f;
  --accent-ink: #ffffff;
  --gold: #a8740f;
  --plus: #2f6b4f;
  --minus: #a2483a;
  --soft: #e2ece4;
  --t0: #c2452d;  /* 朱 */
  --t1: #2b5a9e;  /* 藍 */
  --t2: #a87a12;  /* 山吹 */
  --t3: #6a4c93;  /* 江戸紫 */
  --font-display: "Dela Gothic One", "Hiragino Sans", "Yu Gothic", sans-serif;
  --font-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Noto Sans JP", sans-serif;
  --font-data: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131815; --surface: #1b211d; --ink: #e6ebe6; --muted: #9aa69e; --line: #2f3832;
    --accent: #6fbf95; --accent-ink: #0f1712; --gold: #e0b052; --plus: #6fbf95; --minus: #e08a7c; --soft: #1f2d25;
    --t0: #ef7f66; --t1: #7ea7e6; --t2: #e3b54a; --t3: #b195dc; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131815; --surface: #1b211d; --ink: #e6ebe6; --muted: #9aa69e; --line: #2f3832;
  --accent: #6fbf95; --accent-ink: #0f1712; --gold: #e0b052; --plus: #6fbf95; --minus: #e08a7c; --soft: #1f2d25;
  --t0: #ef7f66; --t1: #7ea7e6; --t2: #e3b54a; --t3: #b195dc; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.6;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 20px 48px;
}
.wrap { max-width: 1040px; margin: 0 auto; display: grid; gap: 20px; }
h1, h2, h3 { text-wrap: balance; margin: 0; }
button, input, select { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.num { font-family: var(--font-data); font-variant-numeric: tabular-nums; }

header.board { display: grid; gap: 10px; padding-block: 8px 4px; }
.eyebrow { font-size: 12px; letter-spacing: .12em; color: var(--muted); text-transform: uppercase; font-family: var(--font-data); }
h1 { font-family: var(--font-display); font-weight: 400; font-size: clamp(30px, 6vw, 46px); line-height: 1.15; letter-spacing: .02em; }
.meta { display: flex; flex-wrap: wrap; gap: 8px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border: 1px solid var(--line); border-radius: 999px; font-size: 13px; background: var(--surface); }
.chip b { font-weight: 700; }
.chip.live { border-color: var(--accent); color: var(--accent); }

nav.tabs { display: flex; gap: 4px; border-bottom: 2px solid var(--ink); overflow-x: auto; }
nav.tabs button { border: 0; background: none; padding: 8px 14px; font-weight: 700; cursor: pointer; color: var(--muted); border-radius: 6px 6px 0 0; white-space: nowrap; }
nav.tabs button[aria-selected="true"] { background: var(--ink); color: var(--bg); }

.banner { padding: 10px 14px; border: 1px dashed var(--gold); border-radius: 8px; background: var(--surface); display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: space-between; }
.banner strong { color: var(--gold); }
.warn { padding: 10px 14px; border-left: 3px solid var(--gold); background: var(--surface); border-radius: 0 8px 8px 0; font-size: 14px; }

.stack { display: grid; gap: 14px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.panel h2 { font-family: var(--font-display); font-weight: 400; font-size: 20px; display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.panel h2 small { font-family: var(--font-body); font-size: 12px; color: var(--muted); font-weight: 500; }
.hint { font-size: 12px; color: var(--muted); }
.scroll { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { padding: 6px 8px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 11px; letter-spacing: .08em; color: var(--muted); font-weight: 500; }
td.n, th.n { text-align: right; font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.plus { color: var(--plus); } .minus { color: var(--minus); }

/* チームの色 */
.tdot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; background: var(--tc, var(--muted)); flex: none; }
.tname { display: inline-flex; align-items: center; gap: 6px; font-weight: 700; }
.t0 { --tc: var(--t0); } .t1 { --tc: var(--t1); } .t2 { --tc: var(--t2); } .t3 { --tc: var(--t3); }

/* チーム順位 */
.rankrow { display: grid; grid-template-columns: 2.2em minmax(0, 9em) 1fr 5.5em; gap: 10px; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
.rankrow:last-child { border-bottom: 0; }
.rankrow .pos { font-family: var(--font-display); font-size: 22px; color: var(--muted); }
.rankrow .pos.first { color: var(--gold); }
.rankrow .who { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rankrow .pts { text-align: right; font-family: var(--font-data); font-size: 18px; font-weight: 600; }
.bar { position: relative; height: 14px; }
.bar::before { content: ""; position: absolute; left: 50%; top: -4px; bottom: -4px; width: 1px; background: var(--line); }
.bar span { position: absolute; top: 0; bottom: 0; background: var(--tc); border-radius: 3px; opacity: .85; }
.breakdown { font-size: 12px; color: var(--muted); grid-column: 2 / -1; font-family: var(--font-data); }

/* 節・卓 */
.toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg { display: inline-flex; flex-wrap: wrap; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.seg button { border: 0; background: var(--surface); padding: 5px 11px; cursor: pointer; font-family: var(--font-data); }
.seg button.done { color: var(--accent); }
.seg button[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
.seg .sep { padding: 5px 8px; font-size: 11px; color: var(--muted); align-self: center; border-left: 1px solid var(--line); }
.tables { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 12px; }
.tbl { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 12px; display: grid; gap: 8px; align-content: start; }
.tbl header { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.tbl h3 { font-family: var(--font-display); font-weight: 400; font-size: 17px; }
.status { font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); }
.status.ok { border-color: var(--accent); color: var(--accent); }
.seat { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) auto; gap: 8px; align-items: center; padding: 4px 0; border-bottom: 1px dashed var(--line); }
.seat:last-of-type { border-bottom: 0; }
.seat .place { font-family: var(--font-data); color: var(--muted); }
.seat .place.p1 { color: var(--gold); font-weight: 600; }
.seat .nm { min-width: 0; display: grid; }
.seat .nm b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: flex; gap: 6px; align-items: center; }
.seat .nm small { font-family: var(--font-data); font-size: 11px; color: var(--muted); padding-left: 16px; }
.seat .pt { font-family: var(--font-data); font-weight: 600; }
.places { display: inline-flex; gap: 2px; }
.places button { width: 28px; height: 28px; border: 1px solid var(--line); background: var(--bg); border-radius: 6px; cursor: pointer; font-family: var(--font-data); padding: 0; }
.places button[aria-pressed="true"] { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.tbl-foot { display: flex; flex-wrap: wrap; gap: 6px 10px; align-items: center; font-size: 12px; color: var(--muted); }
.tbl-foot a { color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--surface); padding: 6px 12px; border-radius: 8px; cursor: pointer; font-weight: 500; }
.btn:hover { border-color: var(--ink); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); font-weight: 700; }
.btn.small { padding: 2px 8px; font-size: 12px; }
.btn.danger { color: var(--minus); }
.btn.armed { background: var(--minus); color: var(--surface); border-color: var(--minus); }
.btn:disabled { opacity: .45; cursor: not-allowed; }
input[type=text], input[type=url], input[type=number], input[type=date], select { border: 1px solid var(--line); background: var(--bg); border-radius: 6px; padding: 5px 8px; min-width: 0; }
input.grow { flex: 1 1 160px; }

/* チーム編成 */
.rosters { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 12px; }
.roster { border-top: 4px solid var(--tc); }
.roster ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 6px; }
.roster li { display: flex; justify-content: space-between; align-items: center; gap: 8px; min-width: 0; }
.roster li .who { min-width: 0; display: grid; }
.roster li .who b { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.roster li .who small { font-family: var(--font-data); font-size: 11px; color: var(--muted); }
.roster li.emptyslot { color: var(--muted); font-size: 13px; }
.roster .acts { display: flex; gap: 4px; flex: none; }

.empty { text-align: center; padding: 36px 16px; display: grid; gap: 10px; justify-items: center; color: var(--muted); }
.empty h2 { color: var(--ink); font-family: var(--font-display); font-weight: 400; font-size: 22px; justify-content: center; }
.empty ol { text-align: left; margin: 0; padding-left: 1.4em; max-width: 34em; }
.mvp { font-size: 11px; color: var(--gold); border: 1px solid var(--gold); border-radius: 999px; padding: 0 6px; margin-left: 6px; font-weight: 700; }

.form { display: grid; gap: 12px; }
.field { display: grid; gap: 4px; }
.field label { font-size: 12px; color: var(--muted); }
.fields { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; }

#toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 8px 16px; border-radius: 8px; font-size: 14px; z-index: 20; max-width: calc(100vw - 32px); }
@media (max-width: 520px) { .rankrow { grid-template-columns: 2em minmax(0, 1fr) 5em; } .rankrow .bar { grid-column: 2 / -1; grid-row: 2; } .breakdown { grid-row: 3; } }
@media (prefers-reduced-motion: no-preference) { .btn, .places button, .bar span { transition: background-color .15s, border-color .15s, width .3s, left .3s; } }
</style>

<div class="wrap">
  <header class="board">
    <div class="eyebrow">Board Game Arena Team League</div>
    <h1 id="title">盤士リーグ</h1>
    <div class="meta" id="meta"></div>
  </header>

  <div id="sampleBanner" class="banner" hidden>
    <span><strong>サンプル表示中</strong>　架空の4チーム16人で画面の動きを見せています。ここでの操作は保存されません。</span>
    <button class="btn small" id="exitSample">サンプルを閉じる</button>
  </div>

  <nav class="tabs" role="tablist" id="tabs">
    <button role="tab" data-tab="standings">チーム順位</button>
    <button role="tab" data-tab="rounds">節・卓</button>
    <button role="tab" data-tab="players">個人成績</button>
    <button role="tab" data-tab="teams">チーム編成</button>
    <button role="tab" data-tab="setup" id="setupTab" hidden>運営設定</button>
  </nav>

  <main id="view"></main>
</div>
<div id="toast" hidden role="status"></div>

<script>
(() => {
  const DEFAULT_CFG = { name: "盤士リーグ", game: "", p1: 5, p2: 1, p3: -1, p4: -3, regular: 8, final: 2, carry: 0.5, deadline: "" };
  const TABS = ["standings", "rounds", "players", "teams", "setup"];
  // GF(4) の掛け算表。卓 = 枠 XOR (節 × チーム番号) にすると、4節で他チーム全員と1回ずつ同卓になる
  const GF4 = [[0, 0, 0, 0], [0, 1, 2, 3], [0, 2, 3, 1], [0, 3, 1, 2]];

  const S = {
    db: null, user: null, isAdmin: false, canWrite: true, me: null, sample: false, loaded: false,
    cfg: { ...DEFAULT_CFG }, teams: new Map(), players: new Map(), results: new Map(), names: {},
    tab: "standings", round: null, editing: null,
  };
  let real = null;

  const $ = (s) => document.querySelector(s);
  const h = (tag, attrs = {}, ...kids) => {
    const el = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (v == null || v === false) continue;
      if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
      else if (k === "class") el.className = v;
      else el.setAttribute(k, v === true ? "" : v);
    }
    for (const k of kids.flat()) if (k != null && k !== false) el.append(k instanceof Node ? k : String(k));
    return el;
  };
  const toast = (msg) => { const t = $("#toast"); t.textContent = msg; t.hidden = false; clearTimeout(toast.t); toast.t = setTimeout(() => (t.hidden = true), 2600); };
  const errMsg = (e) => e && e.code === "not_granted" ? "書き込む権限がありません。運営に権限をもらってください。"
    : e && e.code === "unavailable" ? "通信できませんでした。少し待ってからもう一度試してください。"
    : "保存できませんでした（" + ((e && (e.message || e.code)) || "不明なエラー") + "）";
  const safeBgaUrl = (u) => /^https:\/\/([a-z0-9-]+\.)?boardgamearena\.com\//i.test(u || "") ? u : null;
  const fmt = (n) => { const v = Math.round(n * 10) / 10; return (v > 0 ? "+" : v < 0 ? "−" : "±") + Math.abs(v).toFixed(Number.isInteger(v) ? 0 : 1); };
  const sign = (n) => n > 0.001 ? "plus" : n < -0.001 ? "minus" : "";
  const armed = (label, onConfirm, cls = "btn danger") => {
    const b = h("button", { class: cls, type: "button" }, label);
    b.addEventListener("click", () => {
      if (b.dataset.armed) { clearTimeout(b._t); onConfirm(); return; }
      b.dataset.armed = "1"; b.classList.add("armed"); b.textContent = "もう一度押すと実行";
      b._t = setTimeout(() => { delete b.dataset.armed; b.classList.remove("armed"); b.textContent = label; }, 4000);
    });
    return b;
  };
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  async function write(path, data, mode = "set") {
    if (S.sample) {
      const [col, id] = path.split("/");
      if (col === "config") S.cfg = { ...S.cfg, ...data };
      else { const m = S[col]; if (mode === "delete") m.delete(id); else m.set(id, mode === "update" ? { ...(m.get(id) || {}), ...data } : data); }
      render(); return true;
    }
    if (!S.db) { toast("サインインすると保存できます。"); return false; }
    try {
      const ref = S.db.doc(path);
      if (mode === "delete") await ref.delete(); else if (mode === "update") await ref.update(data); else await ref.set(data);
      return true;
    } catch (e) { toast(errMsg(e)); return false; }
  }

  // ---------- 計算 ----------
  const teamList = () => [...S.teams.entries()].map(([id, t]) => ({ id, ...t })).sort((a, b) => (a.order ?? 0) - (b.order ?? 0)).slice(0, 4);
  const teamIndex = (id) => teamList().findIndex((t) => t.id === id);
  const teamOf = (id) => S.teams.get(id) || { name: "（チームなし）" };
  const pName = (id) => (S.players.get(id) || {}).name || "（削除された選手）";
  const roster = (teamId) => [...S.players.entries()].filter(([, p]) => p.team === teamId).map(([id, p]) => ({ id, ...p })).sort((a, b) => (a.slot ?? 9) - (b.slot ?? 9));
  const totalRounds = () => (+S.cfg.regular || 0) + (+S.cfg.final || 0);
  const isFinal = (n) => n > (+S.cfg.regular || 0);
  const roundLabel = (n) => isFinal(n) ? `F${n - S.cfg.regular}` : `${n}`;
  const ptsTable = () => [S.cfg.p1, S.cfg.p2, S.cfg.p3, S.cfg.p4].map(Number);

  function setupProblems() {
    const ts = teamList(); const out = [];
    if (ts.length < 4) out.push(`チームが ${ts.length} つしかありません（4つ必要）`);
    for (const t of ts) { const n = roster(t.id).length; if (n !== 4) out.push(`${t.name} の選手が ${n} 人です（4人必要）`); }
    return out;
  }

  // 節 n の卓割り。席順は節ごとに回して、卓を作る人（1番目）が偏らないようにする
  function tablesFor(n) {
    const r = (n - 1) % 4; const tables = [[], [], [], []];
    teamList().forEach((t, ti) => roster(t.id).slice(0, 4).forEach((p, slot) => tables[slot ^ GF4[r][ti]].push({ player: p.id, team: t.id })));
    const rot = Math.floor((n - 1) / 4) + r;
    return tables.map((seats) => seats.map((_, i) => seats[(i + rot) % seats.length]).filter(Boolean));
  }

  // 同着はその着順の範囲のポイントを平均して分ける
  function scoreEntries(entries) {
    const pts = ptsTable(); const sorted = [...entries].sort((a, b) => a.place - b.place); const out = new Map();
    for (let i = 0; i < sorted.length;) {
      let j = i; while (j < sorted.length && sorted[j].place === sorted[i].place) j++;
      const avg = pts.slice(i, j).reduce((s, v) => s + v, 0) / (j - i);
      for (let k = i; k < j; k++) out.set(sorted[k].player, { ...sorted[k], pts: avg, pos: i + 1 });
      i = j;
    }
    return out;
  }
  const resultKey = (n, k) => `n${n}t${k}`;
  const allScored = () => [...S.results.values()].filter((r) => Array.isArray(r.entries) && r.entries.length).map((r) => ({ round: r.round, rows: [...scoreEntries(r.entries).values()] }));

  function teamStandings() {
    const rows = new Map(teamList().map((t, i) => [t.id, { ...t, idx: i, reg: 0, fin: 0, games: 0 }]));
    for (const { round, rows: rs } of allScored()) for (const e of rs) {
      const t = rows.get(e.team); if (!t) continue;
      if (isFinal(round)) t.fin += e.pts; else t.reg += e.pts; t.games++;
    }
    const finalStarted = allScored().some((r) => isFinal(r.round));
    for (const t of rows.values()) t.total = finalStarted ? t.reg * S.cfg.carry + t.fin : t.reg;
    return { finalStarted, rows: [...rows.values()].sort((a, b) => b.total - a.total || b.reg - a.reg) };
  }

  function playerStats() {
    const m = new Map([...S.players.entries()].map(([id, p]) => [id, { id, ...p, pts: 0, games: 0, sumPos: 0, firsts: 0 }]));
    for (const { rows } of allScored()) for (const e of rows) {
      let s = m.get(e.player); if (!s) { s = { id: e.player, name: pName(e.player), team: e.team, pts: 0, games: 0, sumPos: 0, firsts: 0 }; m.set(e.player, s); }
      s.pts += e.pts; s.games++; s.sumPos += e.place; if (e.pos === 1) s.firsts++;
    }
    return [...m.values()].sort((a, b) => b.pts - a.pts || (a.games ? a.sumPos / a.games : 9) - (b.games ? b.sumPos / b.games : 9));
  }

  const roundDone = (n) => [0, 1, 2, 3].every((k) => (S.results.get(resultKey(n, k)) || {}).entries);
  const currentRound = () => { for (let n = 1; n <= totalRounds(); n++) if (!roundDone(n)) return n; return totalRounds() || 1; };

  // ---------- 描画 ----------
  function render() {
    $("#title").textContent = S.cfg.name || DEFAULT_CFG.name;
    const done = [...S.results.values()].filter((r) => r.entries).length, all = totalRounds() * 4;
    const cur = currentRound();
    $("#meta").replaceChildren(...[
      h("span", { class: "chip" }, "ゲーム ", h("b", {}, S.cfg.game || "未定")),
      h("span", { class: "chip" }, "着順 ", h("b", { class: "num" }, ptsTable().map(fmt).join(" / "))),
      teamList().length ? h("span", { class: "chip live" }, isFinal(cur) ? "ファイナル " : "レギュラー ", h("b", {}, `第${roundLabel(cur)}節`), ` · ${done}/${all} 卓`) : null,
      S.cfg.deadline ? h("span", { class: "chip" }, "締切 ", h("b", {}, S.cfg.deadline.replaceAll("-", "/"))) : null,
    ].filter(Boolean));
    $("#setupTab").hidden = !(S.isAdmin || S.sample);
    if (S.tab === "setup" && $("#setupTab").hidden) S.tab = "standings";
    for (const b of document.querySelectorAll("#tabs button")) b.setAttribute("aria-selected", b.dataset.tab === S.tab);
    $("#sampleBanner").hidden = !S.sample;
    const v = $("#view");
    if (!S.loaded) { v.replaceChildren(h("div", { class: "panel empty" }, "読み込み中…")); return; }
    v.replaceChildren(({ standings: viewStandings, rounds: viewRounds, players: viewPlayers, teams: viewTeams, setup: viewSetup })[S.tab]());
  }

  const admin = () => S.isAdmin || S.sample;
  const teamTag = (id) => { const i = teamIndex(id); return h("span", { class: `tname t${i}` }, h("span", { class: "tdot" }), teamOf(id).name); };

  function emptyState() {
    return h("div", { class: "panel empty" },
      h("h2", {}, "まだチームがありません"),
      h("ol", {},
        h("li", {}, "「チーム編成」で4チームを作り、各チームに4人ずつ登録する"),
        h("li", {}, "節ごとの卓割りは自動で決まる（4節で他チームの全員と1回ずつ同卓）"),
        h("li", {}, "各卓の1人目が BGA でターン制の卓を作り、3人を招待する"),
        h("li", {}, "終わったら着順を入力すると、チームと個人のポイントに反映される")),
      admin() ? h("button", { class: "btn primary", onclick: () => go("teams") }, "チーム編成をひらく") : h("p", {}, "運営が準備中です。"),
      h("button", { class: "btn", onclick: enterSample }, "サンプルで画面を見てみる"));
  }

  function viewStandings() {
    if (!S.teams.size) return emptyState();
    const { finalStarted, rows } = teamStandings();
    const max = Math.max(1, ...rows.map((r) => Math.abs(r.total)));
    return h("div", { class: "stack" },
      h("section", { class: "panel" },
        h("h2", {}, finalStarted ? "ファイナル順位" : "レギュラーシーズン順位",
          h("small", {}, finalStarted ? `レギュラーのポイント×${S.cfg.carry} を持ち越して合計` : `全${S.cfg.regular}節の合計で、ファイナルに持ち越すのは×${S.cfg.carry}`)),
        h("div", {}, rows.map((r, i) => {
          const w = Math.abs(r.total) / max * 50;
          return h("div", { class: `rankrow t${r.idx}` },
            h("div", { class: "pos" + (i === 0 && r.games ? " first" : "") }, i + 1),
            h("div", { class: "who" }, teamTag(r.id)),
            h("div", { class: "bar", "aria-hidden": "true" }, h("span", { style: `left:${r.total >= 0 ? 50 : 50 - w}%;width:${w}%` })),
            h("div", { class: "pts " + sign(r.total) }, fmt(r.total)),
            h("div", { class: "breakdown" }, finalStarted ? `レギュラー ${fmt(r.reg)} → 持ち越し ${fmt(r.reg * S.cfg.carry)} ／ ファイナル ${fmt(r.fin)}` : `${r.games} 局`));
        }))),
      h("p", { class: "hint" }, `1卓の合計は ${fmt(ptsTable().reduce((a, b) => a + b, 0))}。同着はその着順のポイントを分け合います。`));
  }

  function viewRounds() {
    if (!S.teams.size) return emptyState();
    const probs = setupProblems();
    const n = S.round || currentRound(); S.round = n;
    const segBtns = [];
    for (let i = 1; i <= totalRounds(); i++) {
      if (i === S.cfg.regular + 1) segBtns.push(h("span", { class: "sep" }, "ファイナル"));
      segBtns.push(h("button", { class: roundDone(i) ? "done" : null, "aria-pressed": i === n, title: roundDone(i) ? "全卓終了" : null, onclick: () => { S.round = i; S.editing = null; render(); } }, roundLabel(i)));
    }
    const tables = tablesFor(n);
    return h("div", { class: "stack" },
      probs.length ? h("div", { class: "warn" }, "卓割りを作るには、4チーム×4人がそろう必要があります。", h("br"), probs.join("、")) : null,
      h("div", { class: "toolbar" }, h("div", { class: "seg" }, segBtns)),
      h("h2", { style: "font-family:var(--font-display);font-weight:400;font-size:22px" }, isFinal(n) ? `ファイナル 第${n - S.cfg.regular}節` : `第${n}節`),
      h("div", { class: "tables" }, tables.map((seats, k) => tableCard(n, k, seats))),
      h("p", { class: "hint" }, "各卓の一番上の人が BGA でターン制の卓を作り、残りの3人を招待してください。席順は節ごとに入れ替わります。"));
  }

  function tableCard(n, k, seats) {
    const key = resultKey(n, k); const res = S.results.get(key); const scored = res && res.entries ? scoreEntries(res.entries) : null;
    const editing = S.editing === key;
    const draft = editing ? (S.draft ||= Object.fromEntries((res?.entries || []).map((e) => [e.player, e.place]))) : null;
    const list = scored ? [...scored.values()].sort((a, b) => a.place - b.place) : seats;
    const card = h("article", { class: "tbl" },
      h("header", {}, h("h3", {}, `${String.fromCharCode(65 + k)}卓`), h("span", { class: "status" + (scored ? " ok" : "") }, scored ? "終了" : "対局中")),
      (editing ? seats : list).map((s, i) => {
        const e = scored && scored.get(s.player); const ti = teamIndex(s.team); const p = S.players.get(s.player);
        return h("div", { class: "seat" },
          h("span", { class: "place" + (e && e.pos === 1 && !editing ? " p1" : "") }, editing ? "" : e ? `${e.place}位` : i === 0 ? "卓" : ""),
          h("span", { class: "nm" }, h("b", { class: `t${ti}` }, h("span", { class: "tdot" }), pName(s.player)), h("small", {}, `${teamOf(s.team).name}${p && p.bga ? " · " + p.bga : ""}`)),
          editing ? h("span", { class: "places", role: "group", "aria-label": `${pName(s.player)} の着順` },
            [1, 2, 3, 4].map((pl) => h("button", { type: "button", "aria-pressed": draft[s.player] === pl, onclick: () => { draft[s.player] = pl; render(); } }, pl)))
            : h("span", { class: "pt " + (e ? sign(e.pts) : "") }, e ? fmt(e.pts) : ""));
      }));
    const url = safeBgaUrl(res && res.url);
    if (editing) {
      const urlIn = h("input", { type: "url", id: `url-${key}`, class: "grow", placeholder: "BGA の卓 URL（任意）", value: S.draftUrl ?? (res?.url || "") , oninput: (e) => (S.draftUrl = e.target.value) });
      const save = async () => {
        if (seats.some((s) => !draft[s.player])) { toast("全員の着順を選んでください。"); return; }
        const u = (S.draftUrl ?? res?.url ?? "").trim();
        if (u && !safeBgaUrl(u)) { toast("URL は boardgamearena.com のものを入れてください。"); return; }
        const entries = seats.map((s) => ({ player: s.player, team: s.team, place: draft[s.player] }));
        if (await write(`results/${key}`, { round: n, table: k, entries, url: u, by: S.me || null, at: new Date().toISOString() })) { closeEdit(); toast("着順を保存しました"); render(); }
      };
      card.append(h("div", { class: "toolbar" }, urlIn), h("div", { class: "toolbar" },
        h("button", { class: "btn primary", onclick: save }, "保存する"), h("button", { class: "btn", onclick: () => { closeEdit(); render(); } }, "やめる"),
        res && res.entries ? armed("結果を消す", async () => { if (await write(`results/${key}`, null, "delete")) { closeEdit(); toast("結果を消しました"); } }, "btn small danger") : null));
    } else {
      card.append(h("div", { class: "tbl-foot" },
        url ? h("a", { href: url, target: "_blank", rel: "noopener" }, "BGA の卓") : null,
        res && res.by && S.names[res.by] ? h("span", {}, `入力: ${S.names[res.by]}`) : null,
        (S.canWrite || S.sample) && seats.length === 4 ? h("button", { class: "btn small", onclick: () => { closeEdit(); S.editing = key; render(); } }, scored ? "着順を直す" : "着順を入力") : null));
    }
    return card;
  }
  const closeEdit = () => { S.editing = null; S.draft = null; S.draftUrl = null; };

  function viewPlayers() {
    if (!S.teams.size) return emptyState();
    const stats = playerStats(); const top = stats.find((s) => s.games);
    return h("section", { class: "panel" }, h("h2", {}, "個人成績", h("small", {}, "レギュラー＋ファイナルの合計。トップが MVP 候補")),
      h("div", { class: "scroll" }, h("table", {},
        h("thead", {}, h("tr", {}, h("th", {}, "#"), h("th", {}, "選手"), h("th", {}, "チーム"), ...["局", "ポイント", "平均着順", "1位"].map((t) => h("th", { class: "n" }, t)))),
        h("tbody", {}, stats.map((s, i) => h("tr", {},
          h("td", { class: "n" }, i + 1),
          h("td", {}, h("b", {}, s.name || pName(s.id)), top && s.id === top.id ? h("span", { class: "mvp" }, "MVP") : null),
          h("td", {}, s.team ? teamTag(s.team) : "―"),
          h("td", { class: "n" }, s.games), h("td", { class: "n " + sign(s.pts) }, s.games ? fmt(s.pts) : "―"),
          h("td", { class: "n" }, s.games ? (s.sumPos / s.games).toFixed(2) : "―"), h("td", { class: "n" }, s.firsts)))))));
  }

  function viewTeams() {
    const ts = teamList(); const ad = admin();
    if (!ts.length && !ad) return emptyState();
    const makeTeams = async () => {
      for (let i = teamList().length; i < 4; i++) await write(`teams/${newId()}`, { name: `チーム${i + 1}`, order: i });
      toast("4チームを作りました");
    };
    const freeSlot = (teamId) => { const used = new Set(roster(teamId).map((p) => p.slot)); return [0, 1, 2, 3].find((s) => !used.has(s)); };
    const unassigned = [...S.players.entries()].filter(([, p]) => !ts.some((t) => t.id === p.team)).map(([id, p]) => ({ id, ...p }));
    const name = h("input", { type: "text", id: "newName", placeholder: "名前（表示名）" });
    const bga = h("input", { type: "text", id: "newBga", placeholder: "BGA のユーザー名" });
    const teamSel = h("select", { id: "newTeam" }, ts.map((t) => h("option", { value: t.id }, t.name)));
    const add = async () => {
      const n = name.value.trim(); if (!n) { toast("名前を入れてください。"); return; }
      const slot = freeSlot(teamSel.value); if (slot === undefined) { toast(`${teamOf(teamSel.value).name} はもう4人います。`); return; }
      if (await write(`players/${newId()}`, { name: n, bga: bga.value.trim(), team: teamSel.value, slot })) { name.value = ""; bga.value = ""; name.focus(); toast(`${n} さんを登録しました`); }
    };
    const move = async (p, teamId) => {
      const slot = freeSlot(teamId); if (slot === undefined) { toast(`${teamOf(teamId).name} はもう4人います。`); render(); return; }
      await write(`players/${p.id}`, { team: teamId, slot }, "update");
    };
    const hasResults = S.results.size > 0;
    return h("div", { class: "stack" },
      ad && ts.length < 4 ? h("div", { class: "panel" }, h("h2", {}, "チームを作る"), h("p", { class: "hint" }, "4チームを作ってから、名前を変えて選手を登録します。"), h("div", {}, h("button", { class: "btn primary", onclick: makeTeams }, "4チームを作る"))) : null,
      ad && ts.length ? h("section", { class: "panel" }, h("h2", {}, "選手を登録"),
        h("form", { class: "toolbar", onsubmit: (e) => { e.preventDefault(); add(); } }, name, bga, teamSel, h("button", { class: "btn primary", type: "submit" }, "追加")),
        hasResults ? h("p", { class: "hint" }, "シーズン途中で選手を入れ替えても、それまでの結果は元の選手とチームに残ります。") : null) : null,
      h("div", { class: "rosters" }, ts.map((t, i) => {
        const rs = roster(t.id);
        return h("section", { class: `panel roster t${i}` },
          ad ? h("input", { type: "text", id: `tname-${t.id}`, value: t.name, "aria-label": "チーム名", style: "font-weight:700", onchange: (e) => e.target.value.trim() && write(`teams/${t.id}`, { name: e.target.value.trim() }, "update") })
            : h("h2", {}, teamTag(t.id)),
          h("ol", {}, [0, 1, 2, 3].map((slot) => {
            const p = rs.find((x) => x.slot === slot);
            if (!p) return h("li", { class: "emptyslot" }, "空き");
            return h("li", {}, h("span", { class: "who" }, h("b", {}, p.name), h("small", {}, p.bga || "BGA 未登録")),
              ad ? h("span", { class: "acts" },
                h("select", { id: `mv-${p.id}`, "aria-label": "チームを移す", onchange: (e) => move(p, e.target.value) }, ts.map((x) => h("option", { value: x.id, selected: x.id === t.id }, x.name))),
                armed("外す", () => write(`players/${p.id}`, null, "delete"), "btn small danger")) : null);
          })));
      })),
      unassigned.length && ad ? h("div", { class: "warn" }, `チームに入っていない選手: ${unassigned.map((p) => p.name).join("、")}`) : null);
  }

  function viewSetup() {
    const c = S.cfg;
    const f = (id, label, input, hint) => h("div", { class: "field" }, h("label", { for: id }, label), input, hint ? h("span", { class: "hint" }, hint) : null);
    const inp = (id, type, val, extra = {}) => h("input", { id, type, value: val ?? "", ...extra });
    const save = async (e) => {
      e.preventDefault();
      const num = (id, d) => { const v = parseFloat($(id).value); return Number.isFinite(v) ? v : d; };
      const data = {
        name: $("#cfgName").value.trim() || DEFAULT_CFG.name, game: $("#cfgGame").value.trim(), deadline: $("#cfgDeadline").value,
        p1: num("#cfgP1", 5), p2: num("#cfgP2", 1), p3: num("#cfgP3", -1), p4: num("#cfgP4", -3),
        regular: Math.max(1, Math.min(16, Math.round(num("#cfgReg", 8)))), final: Math.max(0, Math.min(8, Math.round(num("#cfgFin", 2)))), carry: num("#cfgCarry", 0.5),
      };
      if (await write("config/main", data)) { S.round = null; toast("設定を保存しました"); }
    };
    return h("section", { class: "panel" }, h("h2", {}, "大会の設定"),
      h("form", { class: "form", onsubmit: save },
        h("div", { class: "fields" },
          f("cfgName", "リーグ名", inp("cfgName", "text", c.name)),
          f("cfgGame", "ゲーム（BGA のタイトル）", inp("cfgGame", "text", c.game, { placeholder: "未定なら空のまま" })),
          f("cfgDeadline", "締切", inp("cfgDeadline", "date", c.deadline))),
        h("div", { class: "fields" },
          f("cfgP1", "1位", inp("cfgP1", "number", c.p1, { step: "0.5" })), f("cfgP2", "2位", inp("cfgP2", "number", c.p2, { step: "0.5" })),
          f("cfgP3", "3位", inp("cfgP3", "number", c.p3, { step: "0.5" })), f("cfgP4", "4位", inp("cfgP4", "number", c.p4, { step: "0.5" }))),
        h("div", { class: "fields" },
          f("cfgReg", "レギュラーの節数", inp("cfgReg", "number", c.regular, { min: 1, max: 16 }), "4節で1巡。2巡なら8"),
          f("cfgFin", "ファイナルの節数", inp("cfgFin", "number", c.final, { min: 0, max: 8 }), "0 ならファイナルなし"),
          f("cfgCarry", "ファイナルへの持ち越し倍率", inp("cfgCarry", "number", c.carry, { min: 0, max: 1, step: "0.1" }), "0.5 で半分")),
        h("div", {}, h("button", { class: "btn primary", type: "submit" }, "設定を保存"))));
  }

  function go(tab) { S.tab = TABS.includes(tab) ? tab : "standings"; try { history.replaceState(null, "", "#" + S.tab); } catch {} render(); }
  document.querySelectorAll("#tabs button").forEach((b) => b.addEventListener("click", () => go(b.dataset.tab)));

  // ---------- サンプル ----------
  function enterSample() {
    real = { cfg: S.cfg, teams: S.teams, players: S.players, results: S.results };
    S.sample = true; S.cfg = { ...DEFAULT_CFG, name: "盤士リーグ（サンプル）", game: "サンプルのゲーム" };
    S.teams = new Map(); S.players = new Map(); S.results = new Map(); S.round = null; closeEdit();
    ["チーム朱", "チーム藍", "チーム山吹", "チーム紫"].forEach((nm, i) => S.teams.set("t" + i, { name: nm, order: i }));
    for (let i = 0; i < 16; i++) S.players.set("s" + i, { name: `サンプル${String(i + 1).padStart(2, "0")}`, bga: `sample_${i + 1}`, team: "t" + (i % 4), slot: Math.floor(i / 4) });
    let seed = 11; const rnd = () => ((seed = (seed * 9301 + 49297) % 233280) / 233280);
    for (let n = 1; n <= 5; n++) tablesFor(n).forEach((seats, k) => {
      if (n === 5 && k > 1) return;
      const order = seats.map((s) => ({ ...s, r: rnd() + (s.team === "t1" ? 0.15 : 0) })).sort((a, b) => b.r - a.r);
      S.results.set(resultKey(n, k), { round: n, table: k, entries: order.map((s, i) => ({ player: s.player, team: s.team, place: i + 1 })), url: "" });
    });
    S.tab = "standings"; render();
  }
  $("#exitSample").addEventListener("click", () => { S.sample = false; Object.assign(S, real); real = null; S.round = null; closeEdit(); render(); });

  // ---------- 起動 ----------
  const initial = (location.hash || "").slice(1); if (TABS.includes(initial)) S.tab = initial;
  render();

  (async () => {
    const [db, user] = await Promise.all([window.claude?.use?.("db") ?? null, window.claude?.use?.("user") ?? null]);
    S.user = user;
    if (user) {
      S.isAdmin = await user.canEdit().catch(() => false);
      const cw = await user.can("data.write").catch(() => null); S.canWrite = cw !== false;
      S.me = await user.id().catch(() => null);
    } else S.canWrite = false;
    if (!db) { S.loaded = true; S.canWrite = false; render(); return; }
    S.db = db;
    const live = (target) => (snap) => {
      const m = new Map(snap.docs.map((d) => [d.id, d.data()]));
      if (S.sample) { real[target] = m; return; }
      S[target] = m; S.loaded = true; refreshNames(); render();
    };
    const onErr = (e) => { S.loaded = true; render(); toast(errMsg(e)); };
    db.doc("config/main").onSnapshot((d) => {
      const c = { ...DEFAULT_CFG, ...(d.exists ? d.data() : {}) };
      if (S.sample) real.cfg = c; else { S.cfg = c; render(); }
    }, onErr);
    db.collection("teams").onSnapshot(live("teams"), onErr);
    db.collection("players").onSnapshot(live("players"), onErr);
    db.collection("results").onSnapshot(live("results"), onErr);
    setTimeout(() => { if (!S.loaded) { S.loaded = true; render(); } }, 4000);
  })();

  async function refreshNames() {
    if (!S.user || typeof S.user.profiles !== "function") return;
    const ids = [...new Set([...S.results.values()].map((r) => r.by).filter(Boolean))].filter((id) => !(id in S.names));
    if (!ids.length) return;
    try { const ps = await S.user.profiles(ids); for (const id of ids) S.names[id] = (ps[id] && ps[id].name) || ""; render(); } catch {}
  }

  // 卓割りの検算用（4節で他チーム全員と1回ずつ）
  window.__checkPairs = () => {
    const seen = new Map();
    for (let n = 1; n <= 4; n++) for (const t of tablesFor(n)) for (const a of t) for (const b of t) if (a.player < b.player) { const k = a.player + "|" + b.player; seen.set(k, (seen.get(k) || 0) + 1); }
    return { pairs: seen.size, max: Math.max(...seen.values()) };
  };
})();
</script>
